<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
</head>
<body>
    <div id="showdata">

    </div>
    <script>
        const showing = document.getElementById("showdata")
        fetch("https://jsonplaceholder.typicode.com/users").then((res)=>{

            if(!res.ok){
                throw new Error("HTTP Error: +res.status")
            }
            return res.json()

        }).then((data)=>{

            let users = data
            // console.log(products);

            let myDatas = ""

            users.forEach(element => {

                myDatas += `<h2>

                    Username: ${element.name}

                    </h2>`
            })

            showing.innerHTML = myDatas
            
        }).catch((e)=>{
            // console.log(e);
            
        }).finally(()=>{
            console.log("Clear");
            

        })
        
    </script>
    
    
</body>
</html>
